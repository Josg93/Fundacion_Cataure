{% extends 'app_fotos/base.html' %}
{% load static %}
{% block title %}Registrarse — Fototeca Patrimonial{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>Crear cuenta</h2>
    <p class="auth-subtitle">Regístrate para explorar el archivo fotográfico</p>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>
    <p class="auth-footer">
      ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
    </p>
  </div>
</div>
{% endblock %}
